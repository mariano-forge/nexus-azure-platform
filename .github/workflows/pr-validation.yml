name: PR Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  security-events: write
  issues: write

jobs:

  # ─────────────────────────────────────────────────────────────
  # Job 1: Super Linter
  # Runs tflint (Terraform style), Markdown, YAML, JSON linting
  # Note: Super Linter covers tflint (style/lint rules)
  #       The Terraform job below covers fmt and validate (formatting + logic)
  #       Both are complementary, not redundant.
  # ─────────────────────────────────────────────────────────────
  super-linter:
    name: Super Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Super Linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918  # v8.7.0
        env:
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_TERRAFORM_TFLINT: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # Job 2: Terraform Fmt & Validate
  # Checks formatting and validates syntax/logic for all environments
  # Uses -chdir flag (native Terraform) instead of cd for robustness
  # ─────────────────────────────────────────────────────────────
  terraform:
    name: Terraform Fmt & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "v1.15.8"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          for dir in $(find terraform/environments -type f -name "*.tf" -exec dirname {} \; | sort -u); do
            echo "──────────────────────────────────────"
            echo "Validating: $dir"
            echo "──────────────────────────────────────"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

  create-issue-on-failure:
    name: Create Issue on Failure
    runs-on: ubuntu-latest
    needs: [super-linter, terraform]
    # if: always() && contains(needs.*.result, 'failure') && github.event.pull_request == null
    if: always() && contains(needs.*.result, 'failure') && github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create issue on failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const signature = `${context.workflow} on ${context.ref}`;
            const title = `🚨 CI Failure: ${signature}`;
            const body = `
            ## ❌ Workflow Failed

            | Field | Value |
            |-------|-------|
            | **Workflow** | \`${context.workflow}\` |
            | **Branch** | \`${context.ref}\` |
            | **Job** | \`${context.job}\` |
            | **Run** | [${context.runNumber}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) |
            | **Commit** | [${context.sha.substring(0, 7)}](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}) |
            | **Triggered by** | \`${context.actor}\` |

            Please check the [logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) and fix the issue.
            `;

            // Recherche une issue ouverte existante avec le même titre
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['ci-failure']
            });

            const existing = issues.data.find(issue => issue.title === title);

            if (existing) {
              core.info(`Issue #${existing.number} already exists — adding a comment instead.`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `⚠️ **Failure recurred** on run [#${context.runNumber}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) — commit \`${context.sha.substring(0, 7)}\``
              });
              return;
            }

            // Crée une nouvelle issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['ci-failure', 'bug', 'priority/high'],
              assignees: ['mariano-gbego']
            });

  # ─────────────────────────────────────────────────────────────
  # Job 3: Security Scanning (coming in M1)
  # Will cover: tfsec, Checkov, Trivy, Gitleaks, OPA/Conftest
  # See ADR-003 and CONTRIBUTING.md for pipeline security standards
  # ─────────────────────────────────────────────────────────────
