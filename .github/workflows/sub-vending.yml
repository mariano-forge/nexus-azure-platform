name: Subscription Vending

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/stages/2-sub-vending/requests/**.yaml"
  push:
    branches: [main]
    paths:
      - "terraform/stages/2-sub-vending/requests/**.yaml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_DIR: terraform/stages/2-sub-vending
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  detect:
    name: Detect changed subscriptions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Build matrix from changed YAML files
        id: changed
        run: |
          BASE=${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FILES=$(git diff --name-only "$BASE" HEAD -- 'terraform/stages/2-sub-vending/requests/*.yaml' \
            | grep -v '_example' \
            | xargs -I{} basename {} .yaml \
            | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "matrix={\"subscription\":$FILES}" >> "$GITHUB_OUTPUT"

  plan:
    name: Plan — ${{ matrix.subscription }}
    needs: detect
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.detect.outputs.matrix != '{"subscription":[]}'
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302  # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "v1.15.8"

      - name: Terraform Init
        run: |
          terraform -chdir=${{ env.TF_DIR }} init \
            -backend-config="key=subscriptions/${{ matrix.subscription }}.tfstate"

      - name: Terraform Plan
        run: |
          terraform -chdir=${{ env.TF_DIR }} plan \
            -var="subscription_name=${{ matrix.subscription }}" \
            -var="default_billing_scope=${{ secrets.BILLING_SCOPE }}" \
            -out=tfplan -no-color 2>&1 | tee plan_output.txt

      - name: Post plan to PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        if: always()
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8').slice(-65000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Sub Vending Plan — \`${{ matrix.subscription }}\`\n\`\`\`\n${plan}\n\`\`\``
            });

  apply:
    name: Apply — ${{ matrix.subscription }}
    needs: detect
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect.outputs.matrix != '{"subscription":[]}'
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
    environment: platform-prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302  # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "v1.15.8"

      - name: Terraform Init
        run: |
          terraform -chdir=${{ env.TF_DIR }} init \
            -backend-config="key=subscriptions/${{ matrix.subscription }}.tfstate"

      - name: Terraform Apply
        run: |
          terraform -chdir=${{ env.TF_DIR }} apply -auto-approve \
            -var="subscription_name=${{ matrix.subscription }}" \
            -var="default_billing_scope=${{ secrets.BILLING_SCOPE }}"