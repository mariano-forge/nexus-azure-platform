---
# =============================================================================
# GENERATED BY NEXUS IDP SCAFFOLDER — DO NOT EDIT MANUALLY
# =============================================================================

# -----------------------------------------------------------------------------
# OBLIGATOIRE — Identité de la souscription
# -----------------------------------------------------------------------------
subscription_alias_name: "${{ values.subscriptionName }}"
subscription_display_name: "${{ values.subscriptionName }}"
{% if values.billingScope | trim %}
subscription_billing_scope: "${{ values.billingScope }}"
{% endif %}
subscription_workload: "${{ values.workload }}"

# -----------------------------------------------------------------------------
# OBLIGATOIRE — Management Group
# -----------------------------------------------------------------------------
subscription_management_group_id: "${{ values.managementGroupId }}"

# -----------------------------------------------------------------------------
# Tags
# -----------------------------------------------------------------------------
subscription_tags:
  environment: "${{ values.environment }}"
  cost_center: "${{ values.costCenter }}"
  owner: "${{ values.owner }}"
  managed_by: "terraform"
  region: "${{ values.region }}"

# -----------------------------------------------------------------------------
# Resource Groups
# -----------------------------------------------------------------------------
resource_group_creation_enabled: ${{ "true" if values.resourceGroupCreationEnabled else "false" }}
{% if values.resourceGroupCreationEnabled and (values.resourceGroups | length > 0) %}
resource_groups:
{% for rg in values.resourceGroups %}
  ${{ rg.key }}:
    name: "${{ rg.name }}"
{% if rg.location %}
    location: "${{ rg.location }}"
{% endif %}
{% if rg.tags %}
    tags:
{% for key, val in rg.tags %}
      ${{ key }}: "${{ val }}"
{% endfor %}
{% endif %}
    lock_enabled: ${{ "true" if rg.lock_enabled else "false" }}
{% if rg.lock_name %}
    lock_name: "${{ rg.lock_name }}"
{% endif %}
{% endfor %}
{% endif %}

# -----------------------------------------------------------------------------
# Role Assignments
# -----------------------------------------------------------------------------
role_assignment_enabled: ${{ "true" if values.roleAssignmentEnabled else "false" }}
{% if values.roleAssignmentEnabled and (values.roleAssignments | length > 0) %}
role_assignments:
{% for ra in values.roleAssignments %}
  ${{ ra.key }}:
    principal_id: "${{ ra.principal_id }}"
    definition: "${{ ra.definition }}"
{% if ra.relative_scope %}
    relative_scope: "${{ ra.relative_scope }}"
{% endif %}
    principal_type: "${{ ra.principal_type }}"
{% endfor %}
{% endif %}

# -----------------------------------------------------------------------------
# Budgets
# -----------------------------------------------------------------------------
budget_enabled: ${{ "true" if values.budgetEnabled else "false" }}
{% if values.budgetEnabled and (values.budgets | length > 0) %}
budgets:
{% for b in values.budgets %}
  ${{ b.key }}:
    amount: ${{ b.amount }}
    time_grain: "${{ b.time_grain }}"
    time_period_start: "${{ b.time_period_start }}"
    time_period_end: "${{ b.time_period_end }}"
    notifications:
{% for n in b.notifications %}
      ${{ n.key }}:
        enabled: ${{ "true" if n.enabled else "false" }}
        operator: "${{ n.operator }}"
        threshold: ${{ n.threshold }}
        threshold_type: "${{ n.threshold_type }}"
{% if n.contact_emails | length > 0 %}
        contact_emails:
{% for email in n.contact_emails %}
          - "${{ email }}"
{% endfor %}
{% endif %}
{% if n.contact_roles | length > 0 %}
        contact_roles:
{% for role in n.contact_roles %}
          - "${{ role }}"
{% endfor %}
{% endif %}
{% endfor %}
{% endfor %}
{% endif %}

# -----------------------------------------------------------------------------
# Resource Providers
# -----------------------------------------------------------------------------
subscription_register_resource_providers_enabled: ${{ "true" if values.registerProvidersEnabled else "false" }}
{% if values.registerProvidersEnabled and (values.providers | length > 0) %}
subscription_register_resource_providers_and_features:
{% for p in values.providers %}
  "${{ p.provider }}": ${{ p.features | dump }}
{% endfor %}
{% endif %}

# -----------------------------------------------------------------------------
# Managed Identities
# -----------------------------------------------------------------------------
{% if values.identities | length > 0 %}
user_managed_identities:
{% for id in values.identities %}
  ${{ id.key }}:
    name: "${{ id.name }}"
{% if id.resource_group_key %}
    resource_group_key: "${{ id.resource_group_key }}"
{% endif %}
{% if id.resource_group_name_existing %}
    resource_group_name_existing: "${{ id.resource_group_name_existing }}"
{% endif %}
{% if id.tags %}
    tags:
{% for key, val in id.tags %}
      ${{ key }}: "${{ val }}"
{% endfor %}
{% endif %}
{% if id.role_assignments | length > 0 %}
    role_assignments:
{% for ra in id.role_assignments %}
      ${{ ra.key }}:
        definition: "${{ ra.definition }}"
        relative_scope: "${{ ra.relative_scope }}"
{% endfor %}
{% endif %}
{% if id.federated_credentials_github | length > 0 %}
    federated_credentials_github:
{% for fc in id.federated_credentials_github %}
      ${{ fc.key }}:
        organization: "${{ fc.organization }}"
        repository: "${{ fc.repository }}"
        entity: "${{ fc.entity }}"
        value: "${{ fc.value }}"
{% endfor %}
{% endif %}
{% endfor %}
{% endif %}

# -----------------------------------------------------------------------------
# Localisation
# -----------------------------------------------------------------------------
location: "${{ values.region }}"

# -----------------------------------------------------------------------------
# Souscription existante
# -----------------------------------------------------------------------------
subscription_alias_enabled: ${{ "true" if values.subscriptionAliasEnabled else "false" }}