# Example spoke VNet request — copy and rename to {alias}.yaml to submit.
# File name = spoke alias (used as the Terraform state key suffix).
# This file is excluded from processing (name starts with _example).

# Required
spoke_name:    "vnet-spoke-phoenix-dev"  # must be globally unique within the hub
address_space: "10.1.0.0/16"            # must not overlap with hub (10.0.0.0/16) or other spokes

# Optional — defaults to var.default_location
# location: francecentral

# Optional — link spoke to hub private DNS zones.
# Requires private_dns_zones_enabled = true in the hub stage.
private_dns_zone_link_enabled: false

# Required tags (enforced by Azure Policy)
tags:
  application: project-phoenix
  environment: dev
  costCenter:  CC-1234
  owner:       dev@example.com

# -----------------------------------------------------------------------------
# Subnets — map keyed by an arbitrary alias (becomes the Terraform for_each key,
# not the actual Azure subnet name — set "name" explicitly for that).
# Minimal usage only needs "name" + "address_prefix". Everything else below
# is optional and shown here for reference — delete what you don't need.
# -----------------------------------------------------------------------------
subnets:

  # Minimal example — most spokes only need this.
  subnet-app:
    name:           "subnet-app"
    address_prefix: "10.1.1.0/24"

  # Full example — every optional field shown for reference.
  subnet-data:
    name:           "subnet-data"
    address_prefix: "10.1.2.0/24"
    # address_prefixes: ["10.1.2.0/25", "10.1.2.128/25"]  # alternative to address_prefix, mutually exclusive

    # IPAM-based dynamic allocation — alternative to address_prefix/address_prefixes.
    # Only usable if the parent VNet was created with IPAM pools.
    # ipam_pools:
    #   - pool_id:                "/subscriptions/.../ipamPools/pool-spoke"
    #     prefix_length:          24
    #     allocation_type:        "Static"
    #     # number_of_ip_addresses: "256"  # alternative to prefix_length

    # Attach an existing NAT Gateway (must already exist — not created here).
    # nat_gateway:
    #   id: "/subscriptions/.../natGateways/nat-spoke"

    # Attach an existing Network Security Group.
    # network_security_group:
    #   id: "/subscriptions/.../networkSecurityGroups/nsg-subnet-data"

    # Attach an existing Route Table.
    # route_table:
    #   id: "/subscriptions/.../routeTables/rt-spoke"

    # Private endpoint / private link network policies.
    private_endpoint_network_policies:             "Enabled"   # or "Disabled", "NetworkSecurityGroupEnabled", "RouteTableEnabled"
    private_endpoint_network_policies_enabled:     true
    private_link_service_network_policies_enabled: true

    # Whether subnet resources have default outbound internet access.
    default_outbound_access_enabled: false

    # Service endpoints — simple list of service names.
    service_endpoints:
      - "Microsoft.Storage"
      - "Microsoft.KeyVault"

    # Service endpoint policies — map of existing policy resource IDs.
    # service_endpoint_policies:
    #   policy1:
    #     id: "/subscriptions/.../serviceEndpointPolicies/sep-spoke"

    # Subnet delegation (e.g. for App Service, Container Instances, etc.).
    # delegations:
    #   - name: "delegation-appservice"
    #     service_delegation:
    #       name: "Microsoft.Web/serverFarms"

    # Sharing scope — leave null unless using subnet sharing across workloads.
    # sharing_scope: null

    # Per-resource role assignments scoped to this subnet.
    # role_assignments:
    #   network_contributor:
    #     role_definition_id_or_name: "Network Contributor"
    #     principal_id:               "00000000-0000-0000-0000-000000000000"
    #     principal_type:             "ServicePrincipal"

    # Timeouts and retry — rarely need overriding, shown for completeness.
    # timeouts:
    #   create: "30m"
    #   read:   "5m"
    #   update: "30m"
    #   delete: "30m"
    # retry:
    #   error_message_regex:  ["ReferencedResourceNotProvisioned"]
    #   interval_seconds:     10
    #   max_interval_seconds: 180